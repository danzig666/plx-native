name: Sideload build

# A FORK's build: runs the host gates and cross-builds BOTH installable packages from this branch,
# so a change can be put on a television without a local webOS NDK (there is none for Windows or
# x86_64 Linux — see the Makefile's NDK bootstrap block). It is ci.yml's host jobs and cross-build
# plus the one thing that job deliberately refuses to do: package the stable id.
#
#   debug   com.beb.plxnative.debug  — installs BESIDE the real app; dev features on
#   stable  com.beb.plxnative        — RELEASE=1, installs OVER the real app
#
# A tag `v<upstream version>-fork.<n>`, or a manual run with `release_tag`, also PUBLISHES: the two
# packages and their checksums as a GitHub Release of this fork, with `docs/fork-releases/<tag>.md`
# as its body. A release run stamps the packages `<major>.<minor>.<fork number>` (v0.8.0-fork.5 ->
# 0.8.5, `ci/fork-homebrew-repo.py`) so the Homebrew Channel sees each fork release as newer, and
# rewrites the fork's own Channel repository, `repo.json` on the `homebrew` branch. Nothing here
# signs, uploads symbols or touches upstream's webosbrew listing; that is release.yml's job and it
# needs the upstream repository's credentials. A stable package cut
# here carries no telemetry endpoint. (release.yml also wakes on a pushed `v*` tag and stops at its
# tag/version guard, because `-fork.<n>` is not the version in pkg/appinfo.json — that red run is
# expected and harmless.)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        # For a session that can push a branch but not a tag: the release job creates the tag on
        # the commit this run built. Empty = build only.
        description: 'Publish as this fork release tag (e.g. v0.8.0-fork.1); empty = build only'
        required: false
        default: ''
  push:
    branches: [claude/plx-native-version-diff-9faa0w]
    tags: ['v*-fork.*']

permissions:
  contents: read

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release run (a `v*-fork.*` tag, or a dispatch with `release_tag`) of a commit this workflow
  # has already run green does not run the host checks a second time: the packages are rebuilt
  # (they are what gets published), the checks' verdict on the same tree is reused. Anything else
  # — every branch push, a release of a commit never checked — runs them.
  prior:
    name: already checked?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      checked: ${{ steps.look.outputs.checked }}
    steps:
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        run: |
          checked=false
          if [ "$RELEASE" = true ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sideload-build.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq '.total_count')
            [ "${n:-0}" -gt 0 ] && checked=true
          fi
          echo "checked=$checked" >> "$GITHUB_OUTPUT"
          echo "host checks already green for $GITHUB_SHA: $checked" >> "$GITHUB_STEP_SUMMARY"

  # `make check`'s own halves (the Makefile's check-cargo-* / check-python-* targets, the split
  # upstream's ci.yml runs), each on its own runner at once, plus the RELEASE feature type-check.
  host-checks:
    name: host checks (${{ matrix.stage }})
    needs: prior
    if: needs.prior.outputs.checked != 'true'
    # Pinned: `ubuntu-latest` moved to 26.04 on 2026-10-26, whose libcurl fails the media key-mode
    # seek tests (curlio_keymode_tests) and whose smaller disk trips ci/test_disk_preflight.py. Both
    # passed on 24.04 the day before with the same code; the TV runs its own libcurl, not this one.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - stage: lint
            rust: true
            sdl: "false"
            run: make check-cargo-lint
          - stage: unit
            rust: true
            sdl: "true"
            run: make check-cargo-unit-default
          - stage: hostsim
            rust: true
            sdl: "true"
            run: make check-cargo-unit-hostsim
          - stage: release features
            rust: true
            sdl: "false"
            run: cd rust-modules && cargo "+$RUST_TOOLCHAIN" check --lib --no-default-features
          - stage: python
            rust: false
            sdl: "false"
            run: make check-python-rest
          - stage: harness
            rust: false
            sdl: "false"
            run: make check-python-harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # FULL history: tooling self-tests derive a chronology from `git log` (see ci.yml).
          fetch-depth: 0
      - if: matrix.rust
        uses: ./.github/actions/host-rust
        with:
          sdl: ${{ matrix.sdl }}
      - name: ${{ matrix.stage }}
        env:
          CARGO_INCREMENTAL: "0"
        run: ${{ matrix.run }}

  package:
    name: package (${{ matrix.flavor }})
    # MUST be arm64 Linux — the only Linux host the webOS NDK is published for.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: debug
            release: ""
          - flavor: stable
            release: "1"
    # make reads both from the environment, so they ride EVERY invocation below (neither is
    # sticky between make runs) and the assertion scripts see the same configuration.
    env:
      FLAVOR: ${{ matrix.flavor }}
      RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A release run only: the four version files (ci/bump-version.py) say <major>.<minor>.<fork n>,
      # so the .ipk name, its control file and the app's reported version all agree with it. The
      # stable package's check-package.py grades the release note and audit OF THAT VERSION; a fork
      # release's own notes are docs/fork-releases/<tag>.md, so the stamped version's are the
      # upstream release's it is built on, renamed.
      - name: Stamp the fork release version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ver=$(python3 ci/fork-homebrew-repo.py version "$TAG")
          base="${TAG#v}"; base="${base%%-fork.*}"
          python3 ci/bump-version.py "$ver"
          if [ "$ver" != "$base" ]; then
            for d in release-notes release-audits; do
              sed "s/${base//./\\.}/$ver/g" "docs/$d/v$base.md" > "docs/$d/v$ver.md"
            done
          fi

      - name: Install the pinned Rust and the armv7 target
        # rust-modules/rust-toolchain.toml's release with the prebuilt ARMv7 std, as ci.yml's
        # cross-build installs it. No nightly, no rust-src, no `-Z build-std`.
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust-modules
          key: armv7-${{ matrix.flavor }}

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - name: Cache the bundled FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/plxnative/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/build-ffmpeg.sh', 'ci/arm-cc.py', 'ci/check-link-evidence.py', 'ci/stage-link-evidence.py', '.github/actions/webos-ndk/action.yml') }}

      - name: Build
        run: make WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}' -j"$(nproc)"

      - name: Package
        run: make ipk WEBOS_SDK='${{ steps.ndk.outputs.sdk-dir }}'

      # Uploaded BEFORE the assertions so a red check below still leaves the package to inspect.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plxnative-${{ matrix.flavor }}
          path: pkg/*.ipk
          if-no-files-found: error

      - name: ELF assertions
        run: ./ci/check-elf.sh
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}

      - name: Packaging assertions
        env:
          REQUIRE_PACKAGE: "1"
        run: python3 ci/check-package.py

  publish:
    name: publish the fork release
    # `always()` so a host-checks job SKIPPED by `prior` does not skip this one with it; the
    # condition then states the gate itself: packages built, and the checks green now or before.
    if: >-
      always()
      && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
      && needs.package.result == 'success'
      && (needs.host-checks.result == 'success'
          || (needs.host-checks.result == 'skipped' && needs.prior.outputs.checked == 'true'))
    needs: [prior, host-checks, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job with a write token, and only on a release run.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum *.ipk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          note="docs/fork-releases/$TAG.md"
          [ -f "$note" ] || { echo "::error::$note is missing — the release would publish with no notes"; exit 1; }
          case "$TAG" in v*-fork.*) ;; *) echo "::error::'$TAG' is not a v<version>-fork.<n> tag"; exit 1 ;; esac
          title=$(head -n1 "$note" | sed 's/^# *//')
          tail -n +2 "$note" > "$RUNNER_TEMP/body.md"
          # A pushed tag already exists; a dispatch creates it here, on the commit this run built.
          gh release create "$TAG" dist/*.ipk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$title" --notes-file "$RUNNER_TEMP/body.md"
      # The fork's Homebrew Channel repository: one file a viewer adds once in the Channel
      # (raw.githubusercontent.com/<fork>/homebrew/repo.json), rewritten from scratch for every
      # release and force-pushed, so the branch holds the latest release's listing and nothing else.
      - name: Update the Homebrew Channel repository
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ipk=$(ls dist/com.beb.plxnative_*_arm.ipk)
          dir="$RUNNER_TEMP/homebrew"
          mkdir -p "$dir"
          cp pkg/largeIcon.png "$dir/largeIcon.png"
          raw="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/homebrew"
          python3 ci/fork-homebrew-repo.py repo "$TAG" "$ipk" "$GITHUB_REPOSITORY" "$raw/largeIcon.png" > "$dir/repo.json"
          cat "$dir/repo.json"
          printf '# PlxNative fork: Homebrew Channel repository\n\nAdd `%s/repo.json` in Homebrew Channel, Settings, Repositories. Rewritten by the Sideload build workflow for every fork release (now %s).\n' "$raw" "$TAG" > "$dir/README.md"
          cd "$dir"
          git init -q -b homebrew
          git add repo.json largeIcon.png README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Homebrew Channel repository for $TAG"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" homebrew
